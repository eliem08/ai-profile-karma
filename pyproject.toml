[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-profile-karma"
version = "0.1.0"
description = "Credit Karma for what AI knows about you: see it, fix it, delete it"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
ai-profile-karma = "ai_profile_karma.__main__:main"

[tool.setuptools]
packages = ["ai_profile_karma"]
